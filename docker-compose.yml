services:
  db:
    image: postgres:14-alpine
    ports:
      - 5432:5432
    #volumes:
    #  - ~/apps/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_server
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  acount_service:
    build:
      context: .
      dockerfile: dockerfile.account_service
    ports:
      - 8000:8000
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy


  transaction_service:
    build:
      context: .
      dockerfile: dockerfile.transaction_service
    ports:
      - 81:81
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy


volumes:
  rabbitmq_data:
